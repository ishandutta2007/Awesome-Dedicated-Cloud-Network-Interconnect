<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <style>
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dash 25s linear infinite;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <!-- Background Mesh / Flow Lines (Background Layer - Behind Text) -->
  <g opacity="0.25">
    <path d="M-100 150 Q 300 50 600 150 T 1300 150" fill="none" stroke="url(#accent)" stroke-width="2" class="pulse-line"/>
    <path d="M-100 220 Q 400 280 700 120 T 1300 200" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-line" style="animation-duration: 18s;"/>
    <path d="M-100 80 Q 200 200 800 80 T 1300 100" fill="none" stroke="#c084fc" stroke-width="1.5" class="pulse-line" style="animation-duration: 30s;"/>
  </g>

  <!-- Interconnect Network Nodes (Background Layer) -->
  <g opacity="0.3">
    <!-- Cloud A -->
    <circle cx="150" cy="90" r="35" fill="url(#glow)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AWS / GCP</text>
    
    <!-- Cloud B -->
    <circle cx="1050" cy="90" r="35" fill="url(#glow)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1050" y="95" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AZURE / OCI</text>

    <!-- Data Center Hub -->
    <circle cx="600" cy="230" r="40" fill="url(#glow)" stroke="#818cf8" stroke-width="2"/>
    <text x="600" y="234" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">EQUINIX / MEGAPORT</text>

    <!-- Connections -->
    <line x1="180" y1="105" x2="565" y2="215" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1020" y1="105" x2="635" y2="215" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Foreground Content (Guaranteed Crisp & Unobscured) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="420" y="42" width="360" height="28" rx="14" fill="#1e293b" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="600" y="61" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AWESOME CLOUD ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="600" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Dedicated Cloud Network Interconnect
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Direct Connect • Equinix Fabric • Megaport • SONiC • FRRouting • BGP Route Exchange
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(310, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="80" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Low Latency</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="230" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="290" y="21" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🌐 Multi-Cloud Interconnect</text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="500" y="21" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔓 Open Network Fabric</text>
    </g>
  </g>
</svg>
